name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux QA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install npm 12 (project requires >= 12.0.1)
        run: |
          npm install -g --prefix "$RUNNER_TEMP/npm-latest" npm@latest
          echo "$RUNNER_TEMP/npm-latest/bin" >> "$GITHUB_PATH"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libclang-dev \
            libpam0g-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            protobuf-compiler
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install documentation site dependencies
        run: npm ci --prefix site
      - name: Verify tracked build configuration
        run: npm run config:check
      - name: Run repository QA
        run: npm run qa

  postgres-smoke:
    name: PostgreSQL migrate smoke
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev \
            libssl-dev \
            protobuf-compiler
      - name: Run PostgreSQL migrate smoke
        env:
          CENTRALD_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run:
          cargo test -p centrald-server --locked --test postgres_migrate_smoke
          -- --nocapture

  linux-package-smoke:
    name: Linux package install smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install npm 12 (project requires >= 12.0.1)
        run: |
          npm install -g --prefix "$RUNNER_TEMP/npm-latest" npm@latest
          echo "$RUNNER_TEMP/npm-latest/bin" >> "$GITHUB_PATH"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libpam0g-dev \
            libssl-dev \
            protobuf-compiler
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build, pack, and install Linux .deb packages
        run: node scripts/ci-linux-package-smoke.js

  windows:
    name: Windows compile checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install npm 12 (project requires >= 12.0.1)
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'npm-latest'
          npm install -g --prefix $prefix npm@latest
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Rust targets
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - name: Check Windows x64 workspace
        run: cargo check --workspace --locked --target x86_64-pc-windows-msvc
      - name: Run workspace unit tests on Windows
        run: cargo test --workspace --locked
      - name: Check managed client and Admin on Windows ARM64
        run:
          cargo check --locked --target aarch64-pc-windows-msvc -p
          centrald-client -p centrald-admin
