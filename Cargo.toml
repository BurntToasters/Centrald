[workspace]
members = [
  "apps/admin/src-tauri",
  "crates/centrald-protocol",
  "crates/centrald-common",
  "crates/centrald-pki",
  "crates/centrald-platform",
  "crates/centrald-server",
  "crates/centrald-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/BurntToasters/centrald"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
console = "0.16"
dialoguer = "0.12"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8", "rand_core"] }
fs2 = "0.4"
hex = "0.4"
hostname = "0.4"
humantime = "2"
minisign = "0.7"
pkcs8 = { version = "0.10", features = ["encryption", "pem"] }
prost = "0.14"
prost-types = "0.14"
portable-pty = "0.9"
rand = "0.9"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rpassword = "7"
rustix = { version = "1.1.4", features = ["fs"] }
secrecy = { version = "0.10", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.9"
tauri = "2.8.5"
tauri-build = "2.4.1"
tauri-plugin-updater = "=2.10.1"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-build = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
zeroize = { version = "1", features = ["derive"] }
x509-parser = "0.18"
pam = "0.8"
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

centrald-common = { path = "crates/centrald-common" }
centrald-pki = { path = "crates/centrald-pki" }
centrald-platform = { path = "crates/centrald-platform" }
centrald-protocol = { path = "crates/centrald-protocol" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "abort"
strip = true
lto = "thin"
codegen-units = 16
