[workspace]
members = [
  "crates/centrald-proto",
  "crates/centrald-server",
  "crates/centrald-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/BurntToasters/centrald"
homepage = "https://centrald.dev"
authors = ["CentralD contributors"]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "service", "tokio"] }
if-addrs = "0.15"
mime_guess = "2"
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rpassword = "7"
rusqlite = { version = "0.39", features = ["bundled"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
sysinfo = { version = "0.38", default-features = false, features = ["disk", "network", "system"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-service = "0.8"

centrald-proto = { path = "crates/centrald-proto" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Pedantic lints that only add noise to application code.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
panic = "abort"
strip = true
lto = "thin"
codegen-units = 16
opt-level = "s"

[profile.dev]
# Line tables keep backtraces useful; full debug info made builds ~100 MB.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
