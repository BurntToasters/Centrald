services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: centrald
      POSTGRES_USER: centrald
      POSTGRES_PASSWORD: centrald-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centrald"]
      interval: 2s
      timeout: 2s
      retries: 20
