# Shared runtime directory for the root-owned server socket and, later, the
# root:centrald broker socket. Mode 0755 lets the unprivileged client traverse
# to broker.sock; the sockets themselves stay mode 0600/0660.
# The client unit must not use RuntimeDirectory=centrald: systemd would chown
# or remove this directory for User=centrald and break a co-installed server.
d /run/centrald 0755 root root -
